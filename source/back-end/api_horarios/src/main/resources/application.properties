spring.application.name=api_horarios
server.servlet.context-path=/api

# =====================================================================
# SIGH - Configuración de Acceso a Datos por Rol (RNF-04)
# Cuatro pools (uno por perfil: app_administrador, app_coordinador,
# app_aprobador, app_docente). NUNCA se conecta como 'postgres' ni 'sigh_owner'.
# La contraseña corresponde a la fijada al ejecutar 05_roles_permisos.sql.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:172.31.33.191}:${DB_PORT:5432}/${DB_NAME:sigh}}
spring.datasource.username=${DB_USER:app_coordinador}
spring.datasource.password=${APP_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

sigh.db.user.admin=${DB_USER_ADMIN:app_administrador}
sigh.db.password.admin=${DB_PASSWORD_ADMIN:${spring.datasource.password:}}
sigh.db.user.coordinador=${DB_USER_COORD:app_coordinador}
sigh.db.password.coordinador=${DB_PASSWORD_COORD:${spring.datasource.password:}}
sigh.db.user.aprobador=${DB_USER_APROB:app_aprobador}
sigh.db.password.aprobador=${DB_PASSWORD_APROB:${spring.datasource.password:}}
sigh.db.user.docente=${DB_USER_DOCENTE:app_docente}
sigh.db.password.docente=${DB_PASSWORD_DOCENTE:${spring.datasource.password:}}
