spring.application.name=api_horarios
server.servlet.context-path=/api

# =====================================================================
# SIGH - Configuración de Acceso a Datos (RNF-04)
# Las credenciales y host se configuran mediante variables de entorno
# en el entorno de despliegue (systemd / contenedor / perfil local).
# NUNCA se conecta como superusuario 'postgres'.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:172.31.33.191}:${DB_PORT:5432}/${DB_NAME:sigh}}
spring.datasource.username=${DB_USER:app_administrador}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

